services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: lifelink
      POSTGRES_USER: lifelink
      POSTGRES_PASSWORD: lifelink
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lifelink -d lifelink"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - lifelink_postgres:/var/lib/postgresql/data

volumes:
  lifelink_postgres:
